have_fun: false

ignore_patterns:
  # 生成物はレビューしない（正本の変更をレビューする）
  - "docs/domain/**/generated/**"
  - "*/definitions/openapi/**"
  - "**/package-lock.json"

code_review:
  comment_severity_threshold: MEDIUM
  max_review_comments: -1
  pull_request_opened:
    help: false
    summary: false
    code_review: true
    include_drafts: false
