name: Validate Domain Model

# ドメインモデル（docs/domain の LikeC4 モデル）の検査。
# likec4 build は参照先の欠落があっても成功するため validate を併せる。
# 列挙型の JSON Schema は生成物なので、生成し直して差分が出たら失敗にする。
on:
  pull_request:
    paths:
      - 'docs/domain/**'
      - '.github/workflows/validate-domain-model.yaml'
  push:
    branches:
      - main
    paths:
      - 'docs/domain/**'
      - '.github/workflows/validate-domain-model.yaml'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/domain/context-map
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: docs/domain/context-map/package-lock.json

      - uses: go-task/setup-task@v1

      - name: Install dependencies
        run: npm ci

      - name: Validate model
        run: npx likec4 validate ..

      - name: Build static site
        run: npx likec4 build --use-hash-history -o build/site ..

      - name: Regenerate enum JSON Schemas
        run: task generate:enums

      - name: Check generated files are up to date
        run: git diff --exit-code -- ../ && test -z "$(git status --porcelain -- ../)"
