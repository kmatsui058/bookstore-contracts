name: Deploy Docs

# ドキュメントサイト（mkdocs + LikeC4 の図）を GitHub Pages に公開する。サイトの作り方は tools/pages/build-docs-site.sh にある。
#
# GitHub Pages は、無料プランでは公開（public）リポジトリでしか使えない。このリポジトリを非公開のまま
# 置いている間に main へ push するたびに失敗しないよう、push では公開リポジトリのときだけ動かす。
# 手動（workflow_dispatch）では、有料プランなどで非公開のまま Pages を使える場合のために、公開・非公開を問わず動かす。
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: docs/domain/context-map/package-lock.json

      - name: Install mkdocs
        run: pip install -r requirements.txt

      - name: Build site
        # プロジェクトサイトの公開パス（/<リポジトリ名>/c4/）に図のサイトを置く
        env:
          LIKEC4_BASE: /${{ github.event.repository.name }}/c4/
        run: bash tools/pages/build-docs-site.sh

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
